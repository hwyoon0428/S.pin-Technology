name: Merge validated self-improvement PR
on:
  workflow_run:
    workflows: ["Repository validation"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.ENABLE_SELF_IMPROVEMENT_AUTOMERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact PR head, ownership, and successful validation
        env:
          GH_TOKEN: ${{ github.token }
          GH_REPO: ${{ github.repository }
          REPO_OWNER: ${{ github.repository_owner }
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }
          RUN_SHA: ${{ github.event.workflow_run.head_sha }
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUN_REPO" != "$GH_REPO" || "$RUN_BRANCH" != self-improvement/* ]]; then
            echo "Skip: not a same-repository self-improvement branch"
            exit 0
          fi
          candidates=$(gh pr list --repo "$GH_REPO" --state open --head "$RUN_BRANCH" --limit 10 --json number,headRefOid,baseRefName,author,isDraft,headRepositoryOwner)
          pr=$(jq -c 'if length == 1 then .[0] else empty end' <<< "$candidates")
          if [[ -z "$pr" ]]; then
            echo "Skip: no unique open PR for validation run"
            exit 0
          fi
          number=$(jq -r '.number' <<< "$pr")
          head_sha=$(jq -r '.headRefOid' <<< "$pr")
          base=$(jq -r '.baseRefName' <<< "$pr")
          author=$(jq -r '.author.login' <<< "$pr")
          head_owner=$(jq -r '.headRepositoryOwner.login' <<< "$pr")
          draft=$(jq -r '.isDraft' <<< "$pr")
          if [[ "$base" != main || "$author" != "$REPO_OWNER" || "$head_owner" != "$REPO_OWNER" || "$draft" != false || "$head_sha" != "$RUN_SHA" ]]; then
            echo "Skip: PR ownership, readiness, base, or head SHA mismatch"
            exit 0
          fi
          gh pr merge "$number" --repo "$GH_REPO" --merge --match-head-commit "$head_sha"
