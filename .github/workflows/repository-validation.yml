name: Repository validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python3 -m compileall -q scripts tests
      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository docs and merge safeguards
        run: python3 scripts/validate_repo.py
